[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Anas Ghareib"]
repository = "https://github.com/ansgrb/necropolis"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
# Dependencies (tree-sitter grammars, regex) are much faster optimized; our code stays debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
