[package]
name = "necro-store"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
necro-core = { version = "0.1.0", path = "../necro-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "json", "chrono", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
ulid = "3.0.0"
